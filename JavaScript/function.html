<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
</head>
<body>
    <script>
        function abes(a,b) {
            let sum = a + b;
            document.write("<br> Sum is "+sum);
        }
        document.write(abes(8,9));
        
    </script>
</body>
